name: Self-hosted chat Docker build

on:
  push:
    branches: [selfhosted-chat-docker]
    paths:
      - "selfhosted-chat/**"
      - ".github/workflows/selfhosted-chat-docker.yml"
  pull_request:
    paths:
      - "selfhosted-chat/**"
      - ".github/workflows/selfhosted-chat-docker.yml"
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag openui-selfhosted-chat:ci ./selfhosted-chat
